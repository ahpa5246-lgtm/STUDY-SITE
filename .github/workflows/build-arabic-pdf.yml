name: Build Control Theory Homework PDF (LuaLaTeX)
on:
  push:
    paths:
      - 'حل واجبات المحاضرة الاولى.tex'
      - '.github/workflows/build-arabic-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install LuaLaTeX and engineering fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-latex-recommended \
            texlive-pictures texlive-fonts-recommended \
            fonts-urw-base35 fonts-dejavu-core poppler-utils

      - name: Compile report using LuaLaTeX
        shell: bash
        run: |
          set -euo pipefail
          lualatex -interaction=nonstopmode -halt-on-error \
            -jobname=hw_vector "حل واجبات المحاضرة الاولى.tex"
          lualatex -interaction=nonstopmode -halt-on-error \
            -jobname=hw_vector "حل واجبات المحاضرة الاولى.tex"

      - name: Export clean English vector PDFs
        shell: bash
        run: |
          set -euo pipefail
          cp hw_vector.pdf "حل واجبات المحاضرة الاولى.pdf"
          cp hw_vector.pdf "حل واجبات المحاضرة الاولى - نسخة نصية.pdf"
          cp hw_vector.pdf "Control_Theory_Lecture_2_Homework.pdf"
          pdfinfo "Control_Theory_Lecture_2_Homework.pdf" | awk '$1 == "Pages:" { pages=$2 } END { if (pages < 6) exit 1; print "Verified pages:", pages }'
          pdftotext -layout "Control_Theory_Lecture_2_Homework.pdf" - \
            | grep -q 'MIDDLE TECHNICAL UNIVERSITY'
          if pdftotext "Control_Theory_Lecture_2_Homework.pdf" - | grep -Pq '[\x{0600}-\x{06FF}]'; then
            echo "Unexpected Arabic script in English PDF" >&2
            exit 1
          fi

      - name: Commit generated PDF files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "حل واجبات المحاضرة الاولى.pdf" \
                  "حل واجبات المحاضرة الاولى - نسخة نصية.pdf" \
                  "Control_Theory_Lecture_2_Homework.pdf"
          if ! git diff --staged --quiet; then
            git commit -m "Rebuild all-English homework report with LuaLaTeX"
            git push
          fi
